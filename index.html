<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arjona S.A.S — Sistema de Documentos</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>

  <div class="app">

    <!-- ── Sidebar / Historial ───────────────────────── -->
    <div class="sidebar">
      <div class="sidebar-header">
        <h2>Documentos</h2>
        <button class="btn-nueva" onclick="nuevaProforma()">+ Nueva</button>
      </div>
      <div style="display:flex; gap:5px; padding: 0 15px 10px 15px; flex-wrap:wrap; background:inherit; border-bottom:1px solid rgba(255,255,255,0.1);">
        <button style="flex:1; padding:8px 5px; background:#ff4d4f; color:white; border:none; border-radius:4px; cursor:pointer; font-size:12px; font-weight:bold;" onclick="eliminarProformasSeleccionadas()">Eliminar seleccionadas</button>
        <button style="flex:1; padding:8px 5px; background:#d9363e; color:white; border:none; border-radius:4px; cursor:pointer; font-size:12px; font-weight:bold;" onclick="eliminarTodasProformas()">Eliminar todas</button>
        <button style="flex:100%; padding:8px 5px; background:#185FA5; color:white; border:none; border-radius:4px; cursor:pointer; font-size:12px; font-weight:bold;" onclick="reiniciarContadores()">Reiniciar contadores a 0</button>
      </div>
      <div class="ticket-list" id="ticketList">
        <!-- Las proformas se renderizan aquí desde JS -->
      </div>
    </div>

    <!-- ── Área principal ───────────────────────────── -->
    <div class="main" id="mainContent">
      <!-- El formulario o estado vacío se renderizan aquí desde JS -->
    </div>

  </div>

  <script src="cotizacion.js"></script>
</body>

</html>
